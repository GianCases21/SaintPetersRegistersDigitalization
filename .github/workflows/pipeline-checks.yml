name: Pipeline checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mapping and resume stats
        run: python3 scripts/test_scan_pipeline.py
      - name: Generate photographer guide
        run: python3 scripts/scan_resume.py
