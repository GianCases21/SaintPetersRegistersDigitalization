name: Ingest Drive scans

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: ingest-drive
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements.txt
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Check mapping and ingest tests
        run: python3 scripts/test_scan_pipeline.py
      - name: Watch Drive, fetch new pages, transcribe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/auto_ingest.py --download-new incoming
      - name: Commit website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcriptions docs/scan_resume.md
          if git diff --cached --quiet; then
            echo "No ingest changes"
          else
            git commit -m "Ingest new register scans from Google Drive"
            git push
          fi
