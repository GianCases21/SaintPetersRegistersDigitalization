<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saint Peter's Registers — Record Search</title>
<style>
  :root {
    --ink: #2b2620;
    --paper: #faf7f2;
    --card: #ffffff;
    --accent: #7a1f1f;
    --accent-soft: #f3e4e4;
    --line: #e4ddd2;
    --muted: #8a8177;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 28px 24px 22px;
    text-align: center;
  }
  header h1 { font-size: 1.6rem; font-weight: normal; letter-spacing: 0.03em; }
  header p { margin-top: 6px; font-size: 0.95rem; opacity: 0.85; font-style: italic; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .search-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    display: grid;
    grid-template-columns: 2fr 1fr 2fr auto;
    gap: 12px;
    align-items: end;
    box-shadow: 0 2px 8px rgba(43,38,32,0.06);
  }
  .field label {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 5px;
    font-family: Verdana, sans-serif;
  }
  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 11px 22px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #641717; }
  .summary { margin: 18px 4px 10px; font-size: 0.95rem; color: var(--muted); font-style: italic; }
  .results { display: flex; flex-direction: column; gap: 10px; }
  .record {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .record .name { font-size: 1.15rem; margin-bottom: 6px; }
  .record .name .reg {
    font-size: 0.72rem;
    font-family: Verdana, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #fff;
    background: var(--accent);
    border-radius: 4px;
    padding: 2px 8px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .record .name .review {
    font-size: 0.72rem;
    font-family: Verdana, sans-serif;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 2px 8px;
    margin-left: 6px;
    vertical-align: 2px;
  }
  .fields { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.92rem; }
  .fields span b { color: var(--muted); font-weight: normal; font-style: italic; }
  .source { margin-top: 6px; font-size: 0.8rem; color: var(--muted); font-family: Verdana, sans-serif; }
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    font-style: italic;
  }
  footer { text-align: center; padding: 20px; font-size: 0.8rem; color: var(--muted); }
  @media (max-width: 760px) {
    .search-card { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Saint Peter&rsquo;s Registers</h1>
  <p>Search the digitized parish records</p>
</header>
<main>
  <div class="search-card">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="e.g. Monaghan" autofocus>
    </div>
    <div class="field">
      <label for="year">Year</label>
      <input id="year" type="text" placeholder="e.g. 1940" inputmode="numeric">
    </div>
    <div class="field">
      <label for="register">Register</label>
      <select id="register"><option value="">All registers</option></select>
    </div>
    <button id="go">Search</button>
  </div>
  <div class="summary" id="summary">Loading records&hellip;</div>
  <div class="results" id="results"></div>
</main>
<footer>Records transcribed from the original register scans &middot; entries marked &ldquo;needs review&rdquo; have not yet been verified against the scan</footer>
<script>
const NAME_COLS = ['surname','given_name','plot_owner','name','child','father','mother','groom','bride','sponsors','witnesses','officiant'];
const HIDE_COLS = ['register','source_image','needs_review'];
let allRows = [];

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift();
  return rows.map(r => Object.fromEntries(header.map((h, i) => [h, r[i] || ''])));
}

async function loadAll() {
  const manifest = await (await fetch('transcriptions/manifest.json')).json();
  const sel = document.getElementById('register');
  for (const reg of manifest.registers) {
    const opt = document.createElement('option');
    opt.value = reg.id;
    opt.textContent = reg.title;
    sel.appendChild(opt);
    const text = await (await fetch('transcriptions/' + reg.file)).text();
    for (const row of parseCSV(text)) { row._register = reg; allRows.push(row); }
  }
  document.getElementById('summary').textContent =
    allRows.length + ' records loaded from ' + manifest.registers.length + ' register(s). Enter a search above, or press Search to browse everything.';
}

function render(rows) {
  const out = document.getElementById('results');
  out.innerHTML = '';
  document.getElementById('summary').textContent = rows.length + ' record(s) found.';
  if (!rows.length) {
    out.innerHTML = '<div class="empty">No records matched. Try part of a surname, or clear a filter.</div>';
    return;
  }
  for (const row of rows) {
    const div = document.createElement('div');
    div.className = 'record';
    const given = row.given_name || '', sur = row.surname || '';
    const displayName = (given || sur) ? (given + ' ' + sur).trim() : (row.plot_owner || row.name || '(name not recorded)');
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = displayName;
    const regBadge = document.createElement('span');
    regBadge.className = 'reg';
    regBadge.textContent = row._register.title;
    nameEl.appendChild(regBadge);
    if ((row.needs_review || '').toLowerCase() === 'yes') {
      const rv = document.createElement('span');
      rv.className = 'review';
      rv.textContent = 'needs review';
      nameEl.appendChild(rv);
    }
    div.appendChild(nameEl);
    const fields = document.createElement('div');
    fields.className = 'fields';
    for (const [k, v] of Object.entries(row)) {
      if (!v || k.startsWith('_') || HIDE_COLS.includes(k)) continue;
      if (k === 'surname' || k === 'given_name') continue;
      const span = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k.replaceAll('_', ' ') + ': ';
      span.appendChild(b);
      span.appendChild(document.createTextNode(v));
      fields.appendChild(span);
    }
    div.appendChild(fields);
    const src = document.createElement('div');
    src.className = 'source';
    src.textContent = 'Source scan: ' + (row.source_image || 'unknown');
    div.appendChild(src);
    out.appendChild(div);
  }
}

function search() {
  const name = document.getElementById('name').value.trim().toLowerCase();
  const year = document.getElementById('year').value.trim();
  const reg = document.getElementById('register').value;
  const rows = allRows.filter(row => {
    if (reg && row._register.id !== reg) return false;
    if (name) {
      const hay = NAME_COLS.map(c => row[c] || '').join(' ').toLowerCase();
      if (!hay.includes(name)) return false;
    }
    if (year) {
      const hay = Object.entries(row).filter(([k]) => !k.startsWith('_')).map(([, v]) => v).join(' ');
      if (!hay.includes(year)) return false;
    }
    return true;
  });
  render(rows);
}

document.getElementById('go').addEventListener('click', search);
for (const id of ['name', 'year']) {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
}
document.getElementById('register').addEventListener('change', search);
loadAll().catch(err => {
  document.getElementById('summary').textContent =
    'Could not load records: ' + err.message + ' — if you opened this file directly, serve it with: python3 -m http.server';
});
</script>
</body>
</html>
